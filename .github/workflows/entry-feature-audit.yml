name: Entry feature audit
on:
  push:
    branches: ['research/entry-feature-audit']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research-entry-audit.mjs
