name: Validate daily loss shadow only

on:
  push:
    branches: [daily-loss-shadow-readonly-preflight]
    paths:
      - ".github/workflows/validate-daily-loss-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Full regression suite
        run: npm test
      - name: Verify protected source blobs
        shell: bash
        run: |
          test "$(git hash-object worker-v2.js)" = "426f10d8fd73d57de0efdf272b64c9921271fde9"
          test "$(git hash-object analysis-engine.js)" = "2e00019663dad2b80048b764567e6e708f37efc7"
          test "$(git hash-object paper-trader.js)" = "b5e2d5673f4591d0d5f330e4a753e05e78ac7365"
          echo "Protected live/frozen sources unchanged"
