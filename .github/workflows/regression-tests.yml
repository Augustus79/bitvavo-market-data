name: Regression tests
on:
  pull_request:
  push:
    branches: ['fix/live-alert-dust-reconciliation']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
