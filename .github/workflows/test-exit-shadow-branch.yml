name: Exit shadow branch test

on:
  push:
    branches: [exit-shadow-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run regression tests
        run: npm test
      - name: Syntax-check generators
        run: node --check generate-exit-shadow.mjs && node --check generate-paper.mjs && node --check generate-evaluation.mjs
