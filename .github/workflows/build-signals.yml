name: Build trading signals

on:
  push:
    branches: [main]
    paths:
      - "snapshot.json"
      - "analysis-engine.js"
      - "analysis-engine.test.mjs"
      - "generate-signals.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run regression tests
        run: npm test

      - name: Generate deterministic signals
        run: npm run signals

      - name: Commit signals and journal if changed
        run: |
          if [ -z "$(git status --porcelain -- signals.json history)" ]; then
            echo "signals.json and history unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals.json history
          git commit -m "Update deterministic trading signals and journal"
          git push
