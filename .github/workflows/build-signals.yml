name: Build trading signals

on:
  push:
    branches: [main, ai-shadow-review-v1]
    paths:
      - "snapshot.json"
      - "analysis-engine.js"
      - "analysis-engine.test.mjs"
      - "generate-signals.mjs"
      - "paper-trader.js"
      - "paper-trader.test.mjs"
      - "generate-paper.mjs"
      - "worker-v2.js"
      - "ai-review-lib.js"
      - "ai-review.test.mjs"
      - "generate-ai-review.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-trading-signals-main
  cancel-in-progress: true

jobs:
  build-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run regression tests
        run: npm test

      - name: Generate and publish latest deterministic state
        env:
          OPENAI_API_KEY: ${{ secrets.BITVAVO_OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-terra
          AI_MONTHLY_BUDGET_EUR: "2.00"
          AI_USD_TO_EUR_REFERENCE: "0.87"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Publish attempt $attempt"

            # Always rebuild from the latest main so a newer snapshot wins cleanly.
            git fetch origin main
            git reset --hard origin/main

            npm run signals
            npm run ai-review
            npm run paper

            if [ -z "$(git status --porcelain -- signals.json history paper ai)" ]; then
              echo "signals.json, history, paper and AI shadow state already current"
              if [ -n "${{ secrets.ALERT_TRIGGER_KEY }}" ]; then
                curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 30 \
                  -X POST \
                  -H "X-Alert-Key: ${{ secrets.ALERT_TRIGGER_KEY }}" \
                  "https://bitvavo-collector.nicolasbonnin79.workers.dev/alert-check" || true
              fi
              exit 0
            fi

            git add signals.json history paper ai
            git commit -m "Update signals, journal and paper trading state"

            if git push origin HEAD:main; then
              echo "Triggering real-time strict alert check"
              if [ -n "${{ secrets.ALERT_TRIGGER_KEY }}" ]; then
                curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
                  -X POST \
                  -H "X-Alert-Key: ${{ secrets.ALERT_TRIGGER_KEY }}" \
                  "https://bitvavo-collector.nicolasbonnin79.workers.dev/alert-check" || \
                  echo "::warning::Real-time alert check failed; ChatGPT hourly scan remains fallback."
              else
                echo "::warning::ALERT_TRIGGER_KEY secret not configured; real-time alert check skipped."
              fi
              exit 0
            fi

            echo "Remote changed during publish; retrying from latest main"
            sleep 2
          done

          echo "Could not publish derived state after 3 attempts"
          exit 1
