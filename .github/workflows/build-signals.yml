name: Build trading signals

on:
  push:
    branches: [main]
    paths:
      - "snapshot.json"
      - "analysis-engine.js"
      - "analysis-engine.test.mjs"
      - "generate-signals.mjs"
      - "paper-trader.js"
      - "paper-trader.test.mjs"
      - "generate-paper.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-trading-signals-main
  cancel-in-progress: true

jobs:
  build-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run regression tests
        run: npm test

      - name: Generate and publish latest deterministic state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Publish attempt $attempt"

            # Always rebuild from the latest main so a newer snapshot wins cleanly.
            git fetch origin main
            git reset --hard origin/main

            npm run signals
            npm run paper

            if [ -z "$(git status --porcelain -- signals.json history paper)" ]; then
              echo "signals.json, history and paper state already current"
              exit 0
            fi

            git add signals.json history paper
            git commit -m "Update signals, journal and paper trading state"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Remote changed during publish; retrying from latest main"
            sleep 2
          done

          echo "Could not publish derived state after 3 attempts"
          exit 1
