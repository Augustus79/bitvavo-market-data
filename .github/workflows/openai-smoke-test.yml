name: OpenAI smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/openai-smoke-test.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test Responses API + web search
        env:
          OPENAI_API_KEY: ${{ secrets.BITVAVO_OPENAI_API_KEY }}
        run: |
          node <<'NODE'
          const key = process.env.OPENAI_API_KEY;
          if (!key) throw new Error("BITVAVO_OPENAI_API_KEY is missing");

          const response = await fetch("https://api.openai.com/v1/responses", {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${key}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              model: "gpt-5.6-terra",
              store: false,
              reasoning: { effort: "low" },
              tools: [{ type: "web_search" }],
              tool_choice: "required",
              max_output_tokens: 120,
              input: "Search the official OpenAI documentation for GPT-5.6 Terra. Return one short sentence confirming whether web search is supported."
            })
          });

          const body = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(`OpenAI HTTP ${response.status}: ${body?.error?.message || "unknown error"}`);
          }

          const usedWebSearch = (body.output || []).some(x => x?.type === "web_search_call");
          if (!usedWebSearch) throw new Error("Responses API succeeded but web_search was not invoked");

          console.log(JSON.stringify({
            ok: true,
            model: body.model || "gpt-5.6-terra",
            responseIdPresent: Boolean(body.id),
            webSearchUsed: true,
            inputTokens: body.usage?.input_tokens ?? null,
            outputTokens: body.usage?.output_tokens ?? null
          }, null, 2));
          NODE
