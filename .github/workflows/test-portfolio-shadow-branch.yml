name: Portfolio shadow branch test

on:
  push:
    branches: [portfolio-shadow-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run regression tests
        run: npm test
      - name: Generate portfolio shadow
        run: npm run portfolio-shadow
      - name: Validate shadow output
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const latest = JSON.parse(fs.readFileSync("portfolio-shadow/latest.json", "utf8"));
          if (latest.mode !== "shadow") throw new Error("portfolio shadow mode invalid");
          if (latest.affectsLiveTrading !== false) throw new Error("portfolio shadow must not affect live");
          if (latest.affectsFrozenProtocol !== false) throw new Error("portfolio shadow must not affect frozen protocol");
          if (latest.policy.maxPositions !== 3) throw new Error("portfolio max positions must be 3");
          if (latest.policy.maxCombinedRiskEur !== 3) throw new Error("portfolio risk cap must be 3 EUR");
          console.log(JSON.stringify({
            status: latest.status,
            openPositions: latest.openPositions,
            portfolio: latest.portfolio
          }, null, 2));
          NODE
