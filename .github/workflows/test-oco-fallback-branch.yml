name: OCO fallback branch test

on:
  push:
    branches: [oco-orders-fallback-v230]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run regression tests
        run: npm test
      - name: Syntax check worker
        run: node --check worker-v2.js
