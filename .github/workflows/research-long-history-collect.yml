name: Long historical candle collection
on:
  push:
    branches: ['research/historical-backtest-v1']
    paths: ['research/collect-long-history.mjs','.github/workflows/research-long-history-collect.yml']
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/collect-long-history.mjs manifest
      - uses: actions/upload-artifact@v4
        with:
          name: long-history-manifest
          path: manifest.json
          retention-days: 90
  collect:
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: long-history-manifest
      - run: node research/collect-long-history.mjs ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-history-${{ matrix.shard }}
          path: out/
          retention-days: 90
